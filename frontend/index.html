<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Career Path Recommender</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f8f9fa; color: #1a1a2e; }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    h2 { font-size: 1.2rem; margin: 1.5rem 0 0.75rem; color: #333; }
    .tabs { display: flex; gap: 4px; border-bottom: 2px solid #e0e0e0; margin-bottom: 1.5rem; }
    .tab-btn { padding: 10px 20px; border: none; background: none; cursor: pointer; font-size: 14px; border-bottom: 3px solid transparent; margin-bottom: -2px; }
    .tab-btn.active { border-bottom-color: #534AB7; color: #534AB7; font-weight: 600; }
    .panel { display: none; }
    .panel.active { display: block; }
    .upload-zone { border: 2px dashed #ccc; border-radius: 12px; padding: 3rem; text-align: center; cursor: pointer; margin-bottom: 1.5rem; }
    .upload-zone:hover { border-color: #534AB7; background: #EEEDFE; }
    .btn-primary { background: #534AB7; color: white; border: none; padding: 12px 28px; border-radius: 8px; font-size: 15px; cursor: pointer; width: 100%; }
    .btn-primary:hover { background: #3C3489; }
    .career-card { background: white; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; gap: 1rem; }
    .score-ring { width: 64px; height: 64px; flex-shrink: 0; }
    .loading { text-align: center; padding: 3rem; color: #888; }
    .spinner { width: 40px; height: 40px; border: 4px solid #eee; border-top-color: #534AB7; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .gap-tag { font-size: 11px; background: #FAEEDA; color: #854F0B; padding: 3px 8px; border-radius: 99px; display: inline-block; margin: 2px; }
    .chart-wrap { background: white; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.5rem; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    select, input[type=range] { width: 100%; margin-bottom: 1rem; }
    select { padding: 8px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
    .skill-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1.5rem; }
    .skill-chip { font-size: 12px; padding: 5px 12px; border-radius: 99px; border: 1px solid #ccc; cursor: pointer; }
    .skill-chip.selected { background: #EEEDFE; color: #534AB7; border-color: #534AB7; }
    .advice-block { background: #E1F5EE; border-left: 4px solid #1D9E75; padding: 1rem 1.25rem; border-radius: 8px; margin-top: 1rem; font-size: 14px; line-height: 1.7; }
  </style>
</head>
<body>
<div class="container">
  <h1>🎯 AI Career Path Recommender</h1>
  <p style="color: #666; margin-bottom: 1.5rem;">Hybrid ML + LLM powered career guidance</p>

  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('skills')">Skills</button>
    <button class="tab-btn" onclick="showTab('upload')">Resume Upload</button>
    <button class="tab-btn" onclick="showTab('results')">Results</button>
    <button class="tab-btn" onclick="showTab('market')">Market Trends</button>
  </div>

  <!-- SKILLS PANEL -->
  <div id="tab-skills" class="panel active">
    <h2>Select your skills</h2>
    <div class="skill-grid" id="skillGrid"></div>
    <h2>Industry interest</h2>
    <select id="industry">
      <option value="">Select...</option>
      <option value="tech">Technology</option>
      <option value="finance">Finance</option>
      <option value="healthcare">Healthcare</option>
      <option value="consulting">Consulting</option>
      <option value="government">Government</option>
    </select>
    <button class="btn-primary" onclick="submitSkills()">Generate Recommendations →</button>
  </div>

  <!-- UPLOAD PANEL -->
  <div id="tab-upload" class="panel">
    <div class="upload-zone" id="dropZone">
      <div style="font-size: 3rem;">📄</div>
      <p>Drop your PDF resume here or click to upload</p>
      <p style="font-size: 12px; color: #888; margin-top: 8px;">Parsed by Groq (Llama-3.3) + spaCy</p>
      <input type="file" id="resumeFile" accept=".pdf" style="display:none" onchange="uploadResume(this)">
    </div>
    <div id="uploadStatus"></div>
  </div>

  <!-- RESULTS PANEL -->
  <div id="tab-results" class="panel">
    <div id="resultsContainer">
      <p style="color: #888;">Submit your skills first to see recommendations.</p>
    </div>
  </div>

  <!-- MARKET PANEL -->
  <div id="tab-market" class="panel">
    <div class="chart-wrap">
      <h2 style="margin-top:0">Job demand by role</h2>
      <canvas id="demandChart" height="200"></canvas>
    </div>
    <div class="chart-wrap">
      <h2 style="margin-top:0">Average salaries</h2>
      <canvas id="salaryChart" height="200"></canvas>
    </div>
  </div>
</div>

<script>
const API_BASE = "http://localhost:8000";
const SKILLS = ["Python","JavaScript","SQL","Machine learning","Data analysis","React","AWS","Docker","Kubernetes","Excel","Statistics","Figma","Agile","Security","Linux","Spark","Tableau","Git","Deep learning","NLP"];
let selected = new Set();

document.getElementById('dropZone').onclick = () => document.getElementById('resumeFile').click();

// Build skill chips
const grid = document.getElementById('skillGrid');
SKILLS.forEach(s => {
  const chip = document.createElement('span');
  chip.className = 'skill-chip';
  chip.textContent = s;
  chip.onclick = () => { chip.classList.toggle('selected'); selected.has(s) ? selected.delete(s) : selected.add(s); };
  grid.appendChild(chip);
});

function showTab(id) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', ['skills','upload','results','market'][i] === id));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  if (id === 'market') renderMarketCharts();
}

async function submitSkills() {
  if (!selected.size) return alert('Select at least one skill.');
  showTab('results');
  const cont = document.getElementById('resultsContainer');
  cont.innerHTML = '<div class="loading"><div class="spinner"></div><p>Analyzing your profile...</p></div>';
  try {
    const res = await fetch(`${API_BASE}/api/recommend-manual`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ skills: [...selected], industries: [document.getElementById('industry').value] })
    });
    const data = await res.json();
    renderResults(data.recommendations, [...selected]);
  } catch(e) {
    cont.innerHTML = '<p style="color:red;">Could not connect to backend. Is uvicorn running on port 8000?</p>';
  }
}

async function uploadResume(input) {
  const file = input.files[0]; if (!file) return;
  const status = document.getElementById('uploadStatus');
  status.innerHTML = '<div class="loading"><div class="spinner"></div><p>Parsing resume with LLM...</p></div>';
  const form = new FormData();
  form.append('file', file);
  try {
    const res = await fetch(`${API_BASE}/api/upload-resume`, { method: 'POST', body: form });
    const data = await res.json();
    status.innerHTML = `<div class="advice-block"><strong>Parsed profile:</strong><br>Skills found: ${data.parsed_profile.skills.join(', ')}<br>Experience: ${data.parsed_profile.experience_years} years</div>`;
    renderResults(data.recommendations, data.parsed_profile.skills);
    showTab('results');
  } catch(e) {
    status.innerHTML = '<p style="color:red;">Upload failed. Check backend.</p>';
  }
}

function renderResults(recs, userSkills) {
  const cont = document.getElementById('resultsContainer');
  if (!recs || !recs.length) { cont.innerHTML = '<p>No recommendations found.</p>'; return; }

  cont.innerHTML = recs.map((r, i) => `
    <div class="career-card">
      <svg class="score-ring" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="26" fill="${i===0?'#EEEDFE':'#f5f5f5'}" stroke="#eee" stroke-width="5"/>
        <circle cx="32" cy="32" r="26" fill="none" stroke="${i===0?'#534AB7':'#1D9E75'}" stroke-width="5"
          stroke-dasharray="${r.match_score/100*163} 163" stroke-dashoffset="41" stroke-linecap="round"/>
        <text x="32" y="36" text-anchor="middle" font-size="13" font-weight="600" fill="#333">${Math.round(r.match_score)}%</text>
      </svg>
      <div style="flex:1">
        <strong style="font-size:16px">${r.title}</strong>
        <div style="font-size:13px;color:#666;margin:4px 0">💵 $${Math.round(r.avg_salary/1000)}k avg &nbsp;|&nbsp; 📈 +${r.growth_rate}% growth</div>
        ${r.skill_gap.length ? `<div style="margin-top:6px">${r.skill_gap.map(g=>`<span class="gap-tag">${g}</span>`).join('')}</div>` : '<div style="font-size:12px;color:#0F6E56">✅ Strong match</div>'}
        <button onclick="getAdvice('${r.title}', ${JSON.stringify(userSkills)}, ${JSON.stringify(r.skill_gap)})" 
          style="margin-top:8px;font-size:12px;padding:5px 14px;border-radius:6px;border:1px solid #ccc;background:none;cursor:pointer">
          Get AI advice →
        </button>
        <div id="advice-${i}"></div>
      </div>
    </div>
  `).join('');
}

async function getAdvice(role, skills, gap) {
  const idx = document.querySelectorAll('.career-card');
  const target = [...idx].find(c => c.querySelector('strong').textContent === role);
  if (!target) return;
  const box = target.querySelector('[id^="advice"]');
  box.innerHTML = '<div class="loading"><div class="spinner" style="width:24px;height:24px;border-width:3px"></div></div>';
  try {
    const res = await fetch(`${API_BASE}/api/career-advice`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ target_role: role, current_skills: skills, skill_gap: gap })
    });
    const data = await res.json();
    box.innerHTML = `<div class="advice-block">${data.advice.replace(/\n/g,'<br>')}</div>`;
  } catch(e) {
    box.innerHTML = '<p style="color:red;font-size:12px">Backend unavailable</p>';
  }
}

let chartsRendered = false;
function renderMarketCharts() {
  if (chartsRendered) return;
  chartsRendered = true;
  new Chart(document.getElementById('demandChart'), {
    type: 'bar',
    data: {
      labels: ['Data Scientist','AI/ML Eng','DevOps','Cloud Arch','Cybersecurity'],
      datasets: [{ label: 'Open Jobs', data: [52400,41200,38900,29700,35100], backgroundColor: '#534AB7', borderRadius: 6 }]
    },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: v => (v/1000)+'k' } } } }
  });
  new Chart(document.getElementById('salaryChart'), {
    type: 'bar',
    data: {
      labels: ['Cloud Arch','AI/ML','Product Mgr','DevOps','Data Scientist','Data Eng'],
      datasets: [{ label: 'Avg Salary ($k)', data: [145,130,120,118,115,112], backgroundColor: '#1D9E75', borderRadius: 6 }]
    },
    options: { responsive: true, indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { ticks: { callback: v => '$'+v+'k' } } } }
  });
}
</script>
</body>
</html>
